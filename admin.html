<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闲鱼监控设置</title>
  <style>
    :root {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#183047;background:#f4f7f9}
    * {box-sizing:border-box} body {margin:0} main {max-width:960px;margin:32px auto;padding:0 16px}
    h1 {font-size:25px;margin:0 0 8px} .hint {color:#526579;line-height:1.6}
    section {background:white;border:1px solid #dce5ec;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #1830470a}
    label {display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
    input,textarea {font:inherit;width:100%;padding:10px 12px;border:1px solid #bccbd5;border-radius:8px;background:white}
    textarea {min-height:62px;resize:vertical} button {font:inherit;border:0;border-radius:8px;padding:10px 15px;background:#086cb4;color:white;cursor:pointer}
    button.secondary {background:#e6eff5;color:#17354e} button.danger {background:#fff0ed;color:#a7301e}
    .row {display:flex;gap:12px;flex-wrap:wrap} .row>div {flex:1;min-width:180px}
    .toolbar {display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .actions {display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .error {color:#ac2718}.success {color:#15734b}.hidden {display:none} #status {min-height:22px}
  </style>
</head>
<body>
<main>
  <h1>闲鱼监控设置</h1>
  <p class="hint">在网页里添加、修改搜索条件。保存后，下一轮监控自动使用新设置。</p>
  <section id="login">
    <h2>登录</h2>
    <label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button id="loginButton">进入设置</button></div>
  </section>
  <div id="app" class="hidden">
    <div class="toolbar"><p class="hint">每条搜索独立设置价格、关键词与排除词。</p><button id="logout" class="secondary">退出</button></div>
    <div id="cards"></div>
    <div class="toolbar"><button id="add" class="secondary">＋ 添加搜索</button><button id="save">保存全部设置</button></div>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="/admin.js" defer></script>
</body>
</html>
